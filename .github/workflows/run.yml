name: Auto Check DRL HUIT Safe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tải code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt trình duyệt ngầm
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Quét nhanh 30 giây & Phản hồi AI
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Lưu lịch sử cuối phiên
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch sent_history.json chat_id.txt extra_sources.json registered_users.json tele_offset.txt
          git add -A
          git diff --staged --quiet || git commit -m "Update history"
          git pull --rebase || true
          git push || true
